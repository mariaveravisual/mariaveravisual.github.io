name: Optimize Talacre Beach photo for web
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-talacre-photo.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Optimize original photograph and update About pages
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          source = Path("assets/talacre-beach-north-wales.jpg")
          output = Path("assets/talacre-beach-north-wales.webp")
          with Image.open(source) as image:
              icc = image.info.get("icc_profile")
              photo = ImageOps.exif_transpose(image).convert("RGB")
              photo.save(output, format="WEBP", quality=82, method=6, icc_profile=icc)
              print(f"{source.name}: {source.stat().st_size:,} bytes -> {output.name}: {output.stat().st_size:,} bytes, {photo.size}")
          old = "/assets/talacre-beach-north-wales.jpg"
          new = "/assets/talacre-beach-north-wales.webp"
          for filename in ("about/index.html", "es/about/index.html"):
              page = Path(filename)
              html = page.read_text(encoding="utf-8")
              if html.count(old) != 1:
                  raise RuntimeError(f"Unexpected original image references in {filename}: {html.count(old)}")
              page.write_text(html.replace(old, new), encoding="utf-8")
          PY
      - name: Publish optimized photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/talacre-beach-north-wales.webp about/index.html es/about/index.html
          git commit -m "Optimize Talacre Beach About photo as WebP" || exit 0
          git push
